name: Validate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Checkout trusted tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: tooling
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate locales
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SYNC_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'sync/app' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          args=(--root head)
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          if [ "$SYNC_PR" = "true" ]; then args+=(--allow-en-us-change); fi
          node tooling/scripts/validate.mjs "${args[@]}"
