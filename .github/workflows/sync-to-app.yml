name: Sync to app

on:
  push:
    branches: [ main ]
    paths:
      - "locales/**"

concurrency:
  group: sync-to-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-to-app:
    if: "${{ github.repository == 'OutlastTrialsStats/translations' && !startsWith(github.event.head_commit.message, 'chore(sync): strings from the app') && !contains(github.event.head_commit.message, 'sync/app') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translations
        uses: actions/checkout@v7
        with:
          path: translations
          fetch-depth: 0
          filter: blob:none

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          repository: OutlastTrialsStats/OutlastTrialsStats
          token: ${{ secrets.TRANSLATIONS_SYNC_TOKEN }}
          path: app
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply changed translations
        env:
          BEFORE: ${{ github.event.before }}
        run: node translations/scripts/sync.mjs to-app --app app --translations translations --before "$BEFORE"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: app
          token: ${{ secrets.TRANSLATIONS_SYNC_TOKEN }}
          branch: translations/update
          base: main
          commit-message: "chore(i18n): update translations"
          title: "chore(i18n): update translations"
          body: |
            Translations merged in OutlastTrialsStats/translations (${{ github.sha }}).
          delete-branch: true

  completeness:
    if: "${{ github.repository == 'OutlastTrialsStats/translations' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.TRANSLATIONS_SYNC_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update completeness table
        run: |
          node scripts/status.mjs --write-readme
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(readme): update completeness table"
          git push
